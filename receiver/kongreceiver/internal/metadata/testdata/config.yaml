default:
all_set:
  metrics:
    kong.bandwidth_bytes:
      enabled: true
    kong.nginx.connections_total:
      enabled: true
  resource_attributes:
    kong.instance.endpoint:
      enabled: true
none_set:
  metrics:
    kong.bandwidth_bytes:
      enabled: false
    kong.nginx.connections_total:
      enabled: false
  resource_attributes:
    kong.instance.endpoint:
      enabled: false
filter_set_include:
  resource_attributes:
    kong.instance.endpoint:
      enabled: true
      metrics_include:
        - regexp: ".*"
filter_set_exclude:
  resource_attributes:
    kong.instance.endpoint:
      enabled: true
      metrics_exclude:
        - strict: "kong.instance.endpoint-val"
